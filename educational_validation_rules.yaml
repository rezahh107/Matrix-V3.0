validation_rules:
  status_based_rules:
    dual_status_codes_source: "Load dynamically from educational_master.ssot.yaml (allowed_status contains graduate and student)"
    student_only_codes_source: "Load dynamically from educational_master.ssot.yaml (allowed_status is student-only)"
    rule_1: "If code in dual_status_codes, allowed_status must be {0,1}"
    rule_2: "If code in student_only_codes, allowed_status must be {1}"
    rule_3: "Student status = 0 (graduate) only allowed for dual_status codes"
    rule_4: "Student status = 1 (student) allowed for all codes"

  code_7_rules:
    - if code == 7:
        level_must_be: "کنکوری"
        group_must_be: "هنر"
        never_allow_levels:
          - "متوسطه اول"
  code_33_rules:
    - if code == 33:
        level_must_be: "متوسطه اول"
        group_must_be: "هفتم"
        is_experimental_group_must_be: false
  code_5_rules:
    - if code == 5:
        level_must_be: "کنکوری"
        group_must_be: "دوازدهم انسانی"
        is_experimental_group_must_be: true
        never_allow_levels:
          - "دبستان"
  code_41_rules:
    - if code == 41:
        level_must_be: "دبستان"
        group_must_be: "پنجم دبستان"
        is_experimental_group_must_be: false
        never_allow_levels:
          - "کنکوری"
  code_confusion_matrix:
    confusing_codes:
      - code: 7
        wrong_assumption: "پایه هفتم"
        correct_meaning: "گروه هنر کنکوری"
        validation: "code=7 → level=کنکوری, group=هنر, status∈{0,1}"
      - code: 5
        wrong_assumption: "پایه پنجم"
        correct_meaning: "دوازدهم انسانی کنکوری"
        validation: "code=5 → level=کنکوری, group=دوازدهم انسانی, status∈{0,1}"
      - code: 33
        wrong_assumption: "گروه آزمایشی"
        correct_meaning: "پایه هفتم متوسطه اول"
        validation: "code=33 → level=متوسطه اول, group=هفتم, status={1}"
      - code: 41
        wrong_assumption: "کد گروه ۵"
        correct_meaning: "پایه پنجم دبستان"
        validation: "code=41 → level=دبستان, group=پنجم دبستان, status={1}"
