# Golden regression scenarios for Smart Student Allocation
# Update paths to point to committed golden Excel inputs and outputs.

base_dir: docs/golden_datasets/phase01_lock_current_behavior

scenarios:
  - name: phase01_lock_current_behavior
    description: Run matrix build against the phase01 locked golden inputs.
    commands:
      - name: build-matrix
        args:
          - build-matrix
          - --inspactor
          - InspactorReport-1404_09_15-3570.xlsx
          - --schools
          - SchoolReport-1404_09_15-3570.xlsx
          - --output
          - output/phase01_matrix.xlsx
        requires:
          - InspactorReport-1404_09_15-3570.xlsx
          - SchoolReport-1404_09_15-3570.xlsx
