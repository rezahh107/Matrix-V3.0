name: Operational status correction visual evidence

# Historical evidence lane: only runs for pushes to this correction branch.
# The regular UI suite retains operational regressions for all future PRs.
on:
  push:
    branches:
      - fix/operational-progress-status-20261101

permissions:
  contents: read

jobs:
  capture:
    name: Verify and capture operational progress states (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      MATRIX2_TEMP_SKIP_QT_UI: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Head
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - run: uv python install
      - run: uv sync --locked

      - name: Exercise operational regression including keyboard focus
        run: uv run --locked pytest tests/ui/test_operational_progress_status.py -q --maxfail=1

      - name: Verify tracked PR28 Before fixtures against pinned Git blob IDs
        shell: bash
        run: |
          set -euo pipefail
          root=evidence/ui/operational-status-correction-20261101/before
          provenance="$root/PR28_GIT_BLOB_SHA1.tsv"
          test -f "$provenance"
          count=0
          while IFS=$'\t' read -r expected filename; do
            [[ -z "$expected" || "$expected" == "#"* ]] && continue
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid fixture SHA: $filename"; exit 1; }
            # Git for Windows may check out the text provenance as CRLF.
            filename="${filename%
            test -f "$root/$filename"
            actual="$(git hash-object "$root/$filename")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Before fixture changed: $filename"
              exit 1
            fi
            count=$((count + 1))
          done < "$provenance"
          [[ "$count" -eq 16 ]]
          [[ "$(find "$root" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" == "16" ]]

      - name: Capture after states and paired full-resolution screenshots
        run: uv run --locked python tools/capture_operational_status_correction.py --output-dir evidence/ui/operational-status-correction-20261101

      - name: Render existing deterministic UI matrix
        run: uv run --locked python tools/render_ui_matrix.py --output-dir artifacts/ui-render-matrix

      - name: Validate existing bounded High-DPI harness
        run: uv run --locked python tools/validate_ui_dpi.py --output-dir artifacts/ui-dpi

      - name: Upload full-resolution operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-operational-status-correction
          path: evidence/ui/operational-status-correction-20261101
          if-no-files-found: warn

      - name: Upload existing UI render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-existing-ui-render-evidence
          path: artifacts/ui-render-matrix
          if-no-files-found: warn

      - name: Upload existing UI DPI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-existing-ui-dpi-evidence
          path: artifacts/ui-dpi
          if-no-files-found: warn
