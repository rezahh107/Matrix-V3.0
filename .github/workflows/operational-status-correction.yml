name: Operational status correction visual evidence

on:
  push:
    branches:
      - fix/operational-progress-status-20261101
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    name: Verify and capture operational progress states (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      MATRIX2_TEMP_SKIP_QT_UI: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - run: uv python install
      - run: uv sync --locked

      - name: Exercise operational regression including keyboard focus
        run: uv run --locked pytest tests/ui/test_operational_progress_status.py -q --maxfail=1

      - name: Import untouched full-resolution pre-fix PNGs from PR 28
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/verify/matrix-dialog-operational-evidence-20261031
          target=evidence/ui/operational-status-correction-20261101/before
          mkdir -p "$target"
          for theme in light dark; do
            for lang in fa en; do
              for state in ready indeterminate completed controlled-failure; do
                source="evidence/ui/dialog-operational-20261031/operation-${theme}-${lang}-${state}.png"
                git show "FETCH_HEAD:$source" > "$target/operation-${theme}-${lang}-${state}.png"
              done
            done
          done

      - name: Capture after states and paired full-resolution screenshots
        run: uv run --locked python tools/capture_operational_status_correction.py --output-dir evidence/ui/operational-status-correction-20261101

      - name: Upload full-resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-operational-status-correction
          path: evidence/ui/operational-status-correction-20261101
          if-no-files-found: warn

  baseline-ui-control:
    name: Baseline UI suite control (original production commit)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - name: Checkout untouched production baseline
        uses: actions/checkout@v4
        with:
          ref: 782d178f5dc539bc078e04a1e67a10ad6ea5baa4
          persist-credentials: false

      - name: Verify production baseline identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "782d178f5dc539bc078e04a1e67a10ad6ea5baa4"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - run: uv python install
      - run: uv sync --locked

      - name: Run unchanged production UI suite (non-gating baseline control)
        id: baseline
        continue-on-error: true
        run: uv run --locked pytest tests/ui --maxfail=1 -q

      - name: Publish observed baseline outcome
        if: always()
        shell: pwsh
        run: |
          "Untouched baseline 782d178f5dc539bc078e04a1e67a10ad6ea5baa4 UI suite outcome: ${{ steps.baseline.outcome }}" >> $env:GITHUB_STEP_SUMMARY
