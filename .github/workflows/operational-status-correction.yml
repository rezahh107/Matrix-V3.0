            [[ "$filename" =~ ^operation-(light|dark)-(en|fa)-(ready|indeterminate|completed|controlled-failure)\.png$ ]] || { echo "::error::Unexpected fixture name: $filename"; exit 1; }
            test -f "$root/$filename"
