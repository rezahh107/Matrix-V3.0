name: temporary fix capacity test DB precondition

on:
  push:
    branches: ["fix/groupcode-runtime-authority"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX2_TEMP_SKIP_QT_UI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - name: Patch stale test precondition and verify
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("tests/unit/test_allocate_students.py")
          text = path.read_text(encoding="utf-8")
          old = '''    students_path = tmp_path / "students.xlsx"
              pool_path = tmp_path / "pool.xlsx"
              output_path = tmp_path / "out.xlsx"
          '''.replace("              ", "")
          new = '''    students_path = tmp_path / "students.xlsx"
              pool_path = tmp_path / "pool.xlsx"
              output_path = tmp_path / "out.xlsx"
              db_path = tmp_path / "authority.sqlite"

              from app.infra.groupcode.groupcode_repository import GroupCodeRepository
              from app.infra.local_database import LocalDatabase
              from app.infra.schools.school_repository import SchoolRepository

              db = LocalDatabase(db_path)
              schools_ref = tmp_path / "schools-ref.xlsx"
              pd.DataFrame(
                  {
                      "کد مدرسه": [100],
                      "نام مدرسه": ["Synthetic School"],
                      "مرکز گلستان صدرا": [1],
                      "جنسیت": [1],
                      "فعال": [1],
                  }
              ).to_excel(schools_ref, index=False)
              SchoolRepository(db).import_from_excel(schools_ref)

              groupcodes_ref = tmp_path / "groupcodes-ref.xlsx"
              pd.DataFrame(
                  {
                      "group_code": [27],
                      "level": ["متوسطه دوم"],
                      "grade": [12],
                      "track": ["تجربی"],
                      "is_active": [1],
                  }
              ).to_excel(groupcodes_ref, index=False)
              GroupCodeRepository(db).import_from_excel(groupcodes_ref)
          '''.replace("              ", "")
          if text.count(old) != 1:
              raise SystemExit(f"expected one capacity-test setup block, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old_args = '''            "--policy",
                      str(policy_path),
                  ]
          '''.replace("          ", "")
          new_args = '''            "--policy",
                      str(policy_path),
                      "--local-db",
                      str(db_path),
                  ]
          '''.replace("          ", "")
          # Limit replacement to the target function region to avoid matching another CLI test.
          marker = "def test_cli_capacity_column_default_from_policy"
          start = text.index(marker)
          head, tail = text[:start], text[start:]
          if tail.count(old_args) < 1:
              raise SystemExit("capacity-test CLI arg block not found")
          tail = tail.replace(old_args, new_args, 1)
          path.write_text(head + tail, encoding="utf-8")
          '@ | python -
          uv sync --locked
          uv run --locked pytest tests/unit/test_allocate_students.py::test_cli_capacity_column_default_from_policy -q
          uv run --locked ruff check tests/unit/test_allocate_students.py
      - name: Commit narrow test precondition repair and clean workflow
        shell: bash
        run: |
          rm .github/workflows/_tmp_groupcode_fix_capacity_test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_allocate_students.py .github/workflows/_tmp_groupcode_fix_capacity_test.yml
          git commit -m "test: prepare GroupCode DB for capacity CLI regression"
          git push origin HEAD:fix/groupcode-runtime-authority
