name: temporary PR14 allocate consumer inventory
on:
  push:
    branches: [fix/groupcode-runtime-authority]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 874ec425e92e90be618ff603afb6ff131d37ab1f
      - name: Verify identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "874ec425e92e90be618ff603afb6ff131d37ab1f"
      - name: Inventory CLI allocate consumers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('tests').rglob('*.py')):
              text = p.read_text(encoding='utf-8')
              if ('cli.main(' in text or 'cli_legacy.main(' in text) and '--students' in text and ('"allocate"' in text or "'allocate'" in text):
                  print(f'FILE {p}')
                  lines = text.splitlines()
                  for i,line in enumerate(lines,1):
                      if 'cli.main(' in line or 'cli_legacy.main(' in line or '--students' in line or '--local-db' in line or ('"allocate"' in line or "'allocate'" in line):
                          print(f'{i}: {line}')
          PY
  cleanup:
    if: always()
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp_pr14_allocate_consumer_inventory.yml
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/_tmp_pr14_allocate_consumer_inventory.yml
          git commit -m "chore: remove temporary PR14 allocate inventory"
          git push origin HEAD:fix/groupcode-runtime-authority
