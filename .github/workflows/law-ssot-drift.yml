name: LAW/SSoT Drift Guard

on: pull_request

jobs:
  law-ssot-drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run LAW/SSoT drift guard
        run: python tools/ci/law_ssot_drift_guard.py origin/main HEAD
