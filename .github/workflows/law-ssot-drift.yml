name: LAW/SSoT Drift Guard

on: pull_request

jobs:
  law-ssot-drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run LAW/SSoT drift guard
        run: python tools/ci/law_ssot_drift_guard.py origin/main HEAD
