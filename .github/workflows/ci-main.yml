name: CI — Core & UI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pre-merge-guards:
    name: Pre-merge guards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Set up Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run pre-merge guards
        run: uv run --locked python tools/ci/pre_merge_guards.py

  core-windows:
    name: Core tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX2_TEMP_SKIP_QT_UI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Set up Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run --locked ruff check .

      - name: Run core pytest suite (Windows, includes CI guard tests)
        run: uv run --locked pytest tests/unit tests/infra tests/integration --maxfail=1 -q

  ui-windows:
    name: UI tests (Windows, Qt/PySide6)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [core-windows]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Set up Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run UI pytest suite
        run: uv run --locked pytest tests/ui --maxfail=1 -q

      - name: Generate deterministic UI render evidence
        run: uv run --locked python tools/render_ui_matrix.py --output-dir artifacts/ui-render-matrix

      - name: Validate bounded High-DPI evidence
        run: uv run --locked python tools/validate_ui_dpi.py --output-dir artifacts/ui-dpi

      - name: Upload UI render evidence
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ui-render-evidence
          path: artifacts/ui-render-matrix
          if-no-files-found: error

      - name: Upload UI High-DPI evidence
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ui-dpi-evidence
          path: artifacts/ui-dpi
          if-no-files-found: error
