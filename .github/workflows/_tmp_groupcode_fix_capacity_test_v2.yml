name: temporary fix capacity test DB precondition v2

on:
  push:
    branches: ["fix/groupcode-runtime-authority"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX2_TEMP_SKIP_QT_UI: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - name: Patch stale test precondition
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tests/unit/test_allocate_students.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_cli_capacity_column_default_from_policy(tmp_path: Path) -> None:"
          start = text.index(marker)
          next_def = text.find("\ndef ", start + len(marker))
          next_mark = text.find("\n@pytest", start + len(marker))
          ends = [x for x in (next_def, next_mark) if x != -1]
          end = min(ends) if ends else len(text)
          segment = text[start:end]

          setup_anchor = '    output_path = tmp_path / "out.xlsx"\n'
          if segment.count(setup_anchor) != 1:
              raise SystemExit(f"expected one output_path anchor, found {segment.count(setup_anchor)}")
          setup = setup_anchor + '''    db_path = tmp_path / "authority.sqlite"

              from app.infra.groupcode.groupcode_repository import GroupCodeRepository
              from app.infra.local_database import LocalDatabase
              from app.infra.schools.school_repository import SchoolRepository

              db = LocalDatabase(db_path)
              schools_ref = tmp_path / "schools-ref.xlsx"
              pd.DataFrame(
                  {
                      "کد مدرسه": [100],
                      "نام مدرسه": ["Synthetic School"],
                      "مرکز گلستان صدرا": [1],
                      "جنسیت": [1],
                      "فعال": [1],
                  }
              ).to_excel(schools_ref, index=False)
              SchoolRepository(db).import_from_excel(schools_ref)

              groupcodes_ref = tmp_path / "groupcodes-ref.xlsx"
              pd.DataFrame(
                  {
                      "group_code": [27],
                      "level": ["متوسطه دوم"],
                      "grade": [12],
                      "track": ["تجربی"],
                      "is_active": [1],
                  }
              ).to_excel(groupcodes_ref, index=False)
              GroupCodeRepository(db).import_from_excel(groupcodes_ref)
          '''.replace("              ", "")
          segment = segment.replace(setup_anchor, setup, 1)

          policy_arg = '            str(policy_path),\n'
          if segment.count(policy_arg) != 1:
              raise SystemExit(f"expected one policy arg, found {segment.count(policy_arg)}")
          segment = segment.replace(
              policy_arg,
              policy_arg + '            "--local-db",\n            str(db_path),\n',
              1,
          )
          if '"--local-db"' not in segment or 'GroupCodeRepository(db).import_from_excel' not in segment:
              raise SystemExit("patched capacity test is missing authoritative DB setup")
          path.write_text(text[:start] + segment + text[end:], encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate narrow repair
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked pytest tests/unit/test_allocate_students.py::test_cli_capacity_column_default_from_policy -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check tests/unit/test_allocate_students.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit narrow test repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp_groupcode_fix_capacity_test_v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_allocate_students.py .github/workflows/_tmp_groupcode_fix_capacity_test_v2.yml
          git diff --cached --quiet && { echo 'expected staged test repair'; exit 1; }
          git commit -m "test: prepare GroupCode DB for capacity CLI regression"
          git push origin HEAD:fix/groupcode-runtime-authority
