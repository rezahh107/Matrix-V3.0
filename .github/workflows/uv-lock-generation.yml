name: UV lock generation evidence

on:
  pull_request:

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Generate universal project lock with pinned uv
        run: |
          python -m pip install uv==0.12.7
          uv --version
          uv lock
          uv tree --all-groups --depth 1
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
      - name: Archive exact cleanup freeze source
        run: git archive --format=zip --output=freeze-source.zip 4a00770306f354ff927631f9a9885784e7416c16
      - name: Upload cleanup freeze source
        uses: actions/upload-artifact@v4
        with:
          name: freeze-source
          path: freeze-source.zip
          if-no-files-found: error
