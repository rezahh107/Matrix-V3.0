name: "Diagnostic — PR34 Qt teardown safety (pinned source)"
on:
  push:
    branches: ["diagnostics/pr34-qt-teardown-safety-20261101"]
    paths: [".github/workflows/pr34-qt-teardown-safety.yml"]
permissions:
  contents: read
jobs:
  teardown-safety:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      EXPECTED_SOURCE_SHA: 9c758a35309eb82df2324e96dd82f549a990eaff
    steps:
      - name: Checkout PR source at reviewed exact Head
        uses: actions/checkout@v4
        with:
          ref: 9c758a35309eb82df2324e96dd82f549a990eaff
          fetch-depth: 1
      - name: Verify exact source identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Tested source: $actual"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Install locked Python environment
        run: |
          uv python install
          uv sync --locked
      - name: Lint exact changed test files
        run: uv run --locked ruff check tests/ui/conftest.py tests/ui/test_qt_fixture_window_lifetime.py
      - name: Focused window lifecycle regression tests
        run: uv run --locked python -X faulthandler -m pytest tests/ui/test_qt_fixture_window_lifetime.py -vv --maxfail=1 --durations=0
      - name: Related Loader / fixture / overlay sequence
        run: uv run --locked python -X faulthandler -m pytest tests/ui/test_qt_loader_harness.py tests/ui/test_qt_fixture_window_lifetime.py tests/ui/test_uiux_method_locks.py --maxfail=1 -q --durations=10
