name: "Diagnostic — postrepair Qt fixture ten-window trend"
on:
  push:
    branches: ["diagnostics/qt-lifecycle-postrepair-20261101"]
    paths: [".github/workflows/qt-window-postrepair.yml"]
permissions:
  contents: read
jobs:
  fixture-ten-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Sync pinned dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Observe 10 consecutive fixture lifecycles
        shell: pwsh
        run: uv run --locked python -u -m tools.ci.run_qt_window_accumulation --cleanup fixture --iterations 10 --output artifacts/qt-fixture-postrepair.json
      - name: Upload aggregate, non-sensitive metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-postrepair-ten-windows
          path: artifacts/qt-fixture-postrepair.json
          if-no-files-found: warn
