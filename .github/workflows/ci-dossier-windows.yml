name: CI — Run Review Dossier Windows Evidence

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/ui/history_dialog.py"
      - "tests/ui/test_history_selection_boundary.py"
      - "tools/ci/qualify_run_dossier_windows.py"
      - ".github/workflows/ci-dossier-windows.yml"

permissions:
  contents: read

jobs:
  dossier-windows:
    name: Dossier Windows offscreen (${{ matrix.dpi }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dpi: standard
            scale: "1"
          - dpi: high
            scale: "2"
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      PYTEST_QT_API: pyside6

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected: %s\nActual:   %s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Set up pinned Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Dossier qualification source lint
        run: uv run --locked ruff check tools/ci/qualify_run_dossier_windows.py

      - name: Render actual Dossier and assert interactions
        run: >
          uv run --locked python -m tools.ci.qualify_run_dossier_windows
          --dpi ${{ matrix.dpi }}
          --output-dir artifacts/run-dossier-${{ matrix.dpi }}

      - name: Run focused History Qt regressions
        run: >
          uv run --locked pytest
          tests/ui/test_history_selection_boundary.py
          tests/ui/test_history_dialog_trace_integration.py
          tests/ui/test_history_bulk_fetch.py
          --maxfail=1 -q

      - name: Upload Dossier-specific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-dossier-windows-${{ matrix.dpi }}
          path: artifacts/run-dossier-${{ matrix.dpi }}/
          if-no-files-found: error
