name: CI — Windows uv source qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  current-head-flaky-ui:
    name: Current-head flaky Qt smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Need full history to push this exact source into disposable local Git remote
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Install pinned Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Qualify academic-year selection and confirmation (Windows Qt)
        env:
          MATRIX_ACADEMIC_YEAR_EVIDENCE: ${{ runner.temp }}/matrix-academic-year
        run: |
          uv run --locked python -c "import platform, PySide6; from PySide6.QtCore import qVersion; print(platform.platform(), platform.python_version(), 'PySide6', PySide6.__version__, 'Qt', qVersion())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked pytest -v -r a tests/ui/test_academic_year.py tests/ui/helpers/test_counter_helpers.py tests/unit/test_counter_ssot.py tests/unit/test_counter_engine.py tests/integration/test_counter_integration.py tests/integration/test_cli_counter_args.py
      - name: Upload academic-year FA and EN offscreen captures
        uses: actions/upload-artifact@v4
        with:
          name: matrix-academic-year-windows-qt
          path: ${{ runner.temp }}/matrix-academic-year/*.png
          if-no-files-found: error
      - name: Focused Windows filesystem qualification regressions
        run: uv run --locked pytest tests/unit/test_windows_uv_runtime_probe.py -q
      - name: Synthetic personal Git version upgrade and rollback (Windows)
        run: uv run --locked pytest tests/unit/test_personal_release.py -q
      - name: Owner CMD wrapper smoke on Windows
        shell: cmd
        run: call Matrix-Personal.cmd status
      - name: Real Matrix disposable-tag Git+uv install and startup (Windows)
        env:
          MATRIX_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: uv run --locked python -m tools.ci.probe_personal_release_actual_windows
      - name: Reproduce existing scheduled flaky UI smoke
        run: uv run --locked python -m tools.ci.run_flaky_ui_smoke

  roster-runtime:
    name: Roster GUI-to-CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Exercise Roster inputs, real Preflight and allocation
        shell: bash
        run: |
          set -e
          uv run --locked python -c 'import platform, PySide6; from PySide6.QtCore import qVersion; print(platform.platform(), platform.python_version(), "PySide6", PySide6.__version__, "Qt", qVersion())'
          uv run --locked pytest -v -ra tests/integration/test_groupcode_runtime_authority.py -k 'test_roster_'
      - name: Render and operate compact FA and EN controls at 150% (Windows Qt offscreen)
        if: runner.os == 'Windows'
        env:
          QT_SCALE_FACTOR: "1.5"
          MATRIX_ROSTER_EXPECTED_DPR: "1.5"
          MATRIX_ACADEMIC_YEAR_EVIDENCE: ${{ runner.temp }}/matrix-roster-dpi
        run: uv run --locked pytest -v -ra tests/ui/test_academic_year.py -k 'controls_fit_and_render_at_compact_width'
      - name: Upload synthetic Roster captures at 150%
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-roster-150pct-windows-qt
          path: ${{ runner.temp }}/matrix-roster-dpi/*.png
          if-no-files-found: error
      - name: Probe Windows QPA capability and exercise exposed native Qt window
        id: native-qt
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
          MATRIX_ROSTER_EXPECTED_QPA: windows
          MATRIX_ACADEMIC_YEAR_EVIDENCE: ${{ runner.temp }}/matrix-roster-native
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          Write-Host "WINDOWS_QPA_ADMISSION session_id=$sessionId user_interactive=$([Environment]::UserInteractive)"
          if ($sessionId -eq 0 -or -not [Environment]::UserInteractive) {
            Write-Host "WINDOWS_QPA_NOT_PROVEN: runner process has no visible user window station."
            exit 0
          }
          uv run --locked pytest -v -ra tests/ui/test_academic_year.py -k 'controls_fit_and_render_at_compact_width or allocate_roster_presence_gate'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked pytest -v -ra tests/integration/test_groupcode_runtime_authority.py -k 'standard-both or deferred_preflight_rechecks_captured_paths_and_retries'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ran=true" >> $env:GITHUB_OUTPUT
      - name: Upload synthetic native Qt Roster captures
        if: steps.native-qt.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-roster-native-windows-qt
          path: ${{ runner.temp }}/matrix-roster-native/*.png
          if-no-files-found: error

  source-candidate-linux:
    name: Exact-blob source archive (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Focused Linux source and no-clobber regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uvx --from pytest==9.1.1 pytest -q --confcutdir=tests/unit tests/unit/test_uv_source_release.py tests/unit/test_personal_release.py tests/unit/test_github_release.py tests/unit/test_github_release_lifecycle.py
      - name: Read-only hosted GitHub ZIP/TAR source eligibility and exact-byte check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from tools.ci.github_release import (
              PublicationError, public_snapshot_blobs, snapshot_risks,
              tree_blobs, verify_hosted_archives,
          )
          tracked = tree_blobs()
          archive = public_snapshot_blobs(tracked)
          risks = snapshot_risks(archive)
          if risks:
              raise PublicationError("Unreviewed source paths: " + ", ".join(risks[:10]))
          verify_hosted_archives(os.environ["EXPECTED_SHA"], archive)
          print(f"READ_ONLY_GITHUB_SOURCE_VERIFIED tracked={len(tracked)} "
                f"archive={len(archive)} omitted={len(tracked) - len(archive)}")
          PY
      - name: Build and validate Git-blob-identical source archive
        run: python3 tools/ci/qualify_uv_source.py --output-dir "${RUNNER_TEMP}/matrix-uv-candidate"
      - name: Prepare actual version and release notes (audit-only, no publication)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          SHA="$(git rev-parse HEAD)"
          python3 -m tools.ci.github_release prepare --version "$VERSION" \
            --sha "$SHA" --audit-only --directory "$RUNNER_TEMP/matrix-release-audit"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "matrix-release-audit"
          metadata = json.loads((root / "release-provenance.json").read_text())
          assert metadata["preparation_state"] == "CREATED_BEFORE_PUBLICATION"
          assert metadata["full_source_snapshot_risk_count"] == 0
          assert metadata["candidate_files_checked_against_git_tree"] > 0
          notes = (root / "release-notes.md").read_text()
          assert "## Historical entry:" not in notes
          assert "## Changes" in notes
          print("ACTUAL_RELEASE_PREPARE_AUDIT_ONLY_SUCCESS", metadata["tag"],
                metadata["source_sha"])
          PY
      - name: Upload reviewable candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: matrix-uv-source-candidate
          path: ${{ runner.temp }}/matrix-uv-candidate/*
          if-no-files-found: error

  source-candidate-windows:
    name: Clean source archive and uv Windows launch
    needs: [source-candidate-linux]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Download exact-blob source archive and manifest
        uses: actions/download-artifact@v4
        with:
          name: matrix-uv-source-candidate
          path: ${{ runner.temp }}/matrix-uv-candidate
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Fresh Windows uv setup and real entrypoint
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $candidate = "$env:RUNNER_TEMP/matrix-uv-candidate"
          $manifest = Get-Content (Join-Path $candidate "candidate-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:EXPECTED_SHA) { throw "Source SHA mismatch" }
          $archive = Join-Path $candidate $manifest.archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.archive_sha256) { throw "Archive SHA256 mismatch" }
          $source = "$env:RUNNER_TEMP/matrix-uv-clean"
          New-Item -ItemType Directory -Force $source | Out-Null
          Expand-Archive -Path $archive -DestinationPath $source
          Set-Location $source
          $lockHash = (Get-FileHash -Algorithm SHA256 "uv.lock").Hash.ToLowerInvariant()
          if ($lockHash -ne $manifest.uv_lock_sha256) { throw "Extracted lock SHA256 mismatch" }
          $pythonHash = (Get-FileHash -Algorithm SHA256 ".python-version").Hash.ToLowerInvariant()
          if ($pythonHash -ne $manifest.python_version_file_sha256) { throw "Python pin SHA256 mismatch" }
          if ($manifest.privacy_status -ne "REVIEW_REQUIRED_BEFORE_PUBLICATION" -or
              $manifest.publication -ne "NOT_AUTHORIZED") {
            throw "Candidate publication/privacy status was not preserved"
          }
          $env:MATRIX_EXPECTED_PACKAGE_VERSION = $manifest.candidate_package_version_not_official_release
          uv python install
          if ($LASTEXITCODE -ne 0) { throw "Pinned Python install failed" }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw "Clean uv sync failed" }
          uv run --locked python -m tools.ci.probe_windows_uv_runtime
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime probe failed" }
          uv run --locked pytest tests/infra/test_cli_database_preparation.py tests/integration/test_build_matrix_school_expansion.py tests/integration/test_groupcode_runtime_authority.py::test_operator_workflow_db_build_allocate_qa_sabt tests/integration/test_groupcode_runtime_authority.py::test_mainwindow_real_gui_build_allocate_sabt_and_recovery tests/integration/test_groupcode_runtime_authority.py::test_excel_student_import_mixed_national_codes_to_sabt_readback tests/test_excel_export_smoke.py -q
          if ($LASTEXITCODE -ne 0) { throw "Representative clean-source integration failed" }
          $env:MATRIX_CI_SMOKE_CLOSE_MS = "2000"
          $startupLog = Join-Path $env:RUNNER_TEMP "matrix-uv-startup.txt"
          uv run --locked python -m app.main *> $startupLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $startupLog
            throw "Real app.main entrypoint failed"
          }
          $startupText = Get-Content $startupLog -Raw -Encoding utf8
          if ($startupText.Contains("UnicodeEncodeError") -or
              $startupText.Contains("--- Logging error ---")) {
            throw "Console logging failed despite successful application exit"
          }
          Write-Output "Real app.main exited successfully with no console encoding exceptions."

  qa-false-assurance-windows:
    name: QA truthfulness repair (Windows Qt)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact repair Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$MATRIX_EXPECTED_SOURCE_SHA"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Install pinned Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Qualify SQLite reference observation and real operator entrypoints
        run: >
          uv run --locked pytest -v -ra --maxfail=1
          tests/infra/test_reference_readiness_observation.py
          tests/ui/test_reference_readiness_observation_ui.py
          tests/integration/test_groupcode_runtime_authority.py::test_cli_build_and_allocate_cannot_reseed_deleted_imported_groupcodes
      - name: Focused lint
        run: >
          uv run --locked ruff check
          app/infra/health.py app/ui/widgets/health_indicator.py
          app/ui/main_window_base.py
          tests/infra/test_health.py tests/infra/test_health_truthfulness.py
          tests/infra/test_qa_evidence_independence.py
          tests/ui/test_health_indicator.py
          tools/ci/qualify_qa_health_windows.py
      - name: Execute QA/SQLite and Qt regression cases
        run: >
          uv run --locked pytest -q --maxfail=1
          tests/infra/test_health.py
          tests/infra/test_health_truthfulness.py
          tests/infra/test_qa_evidence_independence.py
          tests/ui/test_health_indicator.py
          tests/infra/test_history_strict_snapshot_reads.py
          tests/infra/test_history_store_qa_snapshots.py
      - name: Render actual MainWindow in FA and EN with synthetic QA
        run: >
          uv run --locked python -m tools.ci.qualify_qa_health_windows
          --output-dir artifacts/qa-truthfulness-windows
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-qa-truthfulness-windows
          path: artifacts/qa-truthfulness-windows/
          if-no-files-found: warn
