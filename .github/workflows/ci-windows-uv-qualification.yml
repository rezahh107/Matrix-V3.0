name: CI — Windows uv source qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  current-head-flaky-ui:
    name: Current-head flaky Qt smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Need full history to push this exact source into disposable local Git remote
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Install pinned Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Focused Windows filesystem qualification regressions
        run: uv run --locked pytest tests/unit/test_windows_uv_runtime_probe.py -q
      - name: Synthetic personal Git version upgrade and rollback (Windows)
        run: uv run --locked pytest tests/unit/test_personal_release.py -q
      - name: Owner CMD wrapper smoke on Windows
        shell: cmd
        run: call Matrix-Personal.cmd status
      - name: Real Matrix disposable-tag Git+uv install and startup (Windows)
        env:
          MATRIX_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: uv run --locked python -m tools.ci.probe_personal_release_actual_windows
      - name: Reproduce existing scheduled flaky UI smoke
        run: uv run --locked python -m tools.ci.run_flaky_ui_smoke


  source-candidate-linux:
    name: Exact-blob source archive (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Focused Linux source and no-clobber regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uvx --from pytest==9.1.1 pytest -q --confcutdir=tests/unit tests/unit/test_uv_source_release.py tests/unit/test_personal_release.py tests/unit/test_github_release.py tests/unit/test_github_release_lifecycle.py
      - name: Read-only hosted GitHub ZIP/TAR source eligibility and exact-byte check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from tools.ci.github_release import (
              PublicationError, public_snapshot_blobs, snapshot_risks,
              tree_blobs, verify_hosted_archives,
          )
          tracked = tree_blobs()
          archive = public_snapshot_blobs(tracked)
          risks = snapshot_risks(archive)
          if risks:
              raise PublicationError("Unreviewed source paths: " + ", ".join(risks[:10]))
          verify_hosted_archives(os.environ["EXPECTED_SHA"], archive)
          print(f"READ_ONLY_GITHUB_SOURCE_VERIFIED tracked={len(tracked)} "
                f"archive={len(archive)} omitted={len(tracked) - len(archive)}")
          PY
      - name: Build and validate Git-blob-identical source archive
        run: python3 tools/ci/qualify_uv_source.py --output-dir "${RUNNER_TEMP}/matrix-uv-candidate"
      - name: Upload reviewable candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: matrix-uv-source-candidate
          path: ${{ runner.temp }}/matrix-uv-candidate/*
          if-no-files-found: error

  source-candidate-windows:
    name: Clean source archive and uv Windows launch
    needs: [source-candidate-linux]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Download exact-blob source archive and manifest
        uses: actions/download-artifact@v4
        with:
          name: matrix-uv-source-candidate
          path: ${{ runner.temp }}/matrix-uv-candidate
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Fresh Windows uv setup and real entrypoint
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $candidate = "$env:RUNNER_TEMP/matrix-uv-candidate"
          $manifest = Get-Content (Join-Path $candidate "candidate-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:EXPECTED_SHA) { throw "Source SHA mismatch" }
          $archive = Join-Path $candidate $manifest.archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.archive_sha256) { throw "Archive SHA256 mismatch" }
          $source = "$env:RUNNER_TEMP/matrix-uv-clean"
          New-Item -ItemType Directory -Force $source | Out-Null
          Expand-Archive -Path $archive -DestinationPath $source
          Set-Location $source
          $lockHash = (Get-FileHash -Algorithm SHA256 "uv.lock").Hash.ToLowerInvariant()
          if ($lockHash -ne $manifest.uv_lock_sha256) { throw "Extracted lock SHA256 mismatch" }
          $pythonHash = (Get-FileHash -Algorithm SHA256 ".python-version").Hash.ToLowerInvariant()
          if ($pythonHash -ne $manifest.python_version_file_sha256) { throw "Python pin SHA256 mismatch" }
          if ($manifest.privacy_status -ne "REVIEW_REQUIRED_BEFORE_PUBLICATION" -or
              $manifest.publication -ne "NOT_AUTHORIZED") {
            throw "Candidate publication/privacy status was not preserved"
          }
          $env:MATRIX_EXPECTED_PACKAGE_VERSION = $manifest.candidate_package_version_not_official_release
          uv python install
          if ($LASTEXITCODE -ne 0) { throw "Pinned Python install failed" }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw "Clean uv sync failed" }
          uv run --locked python -m tools.ci.probe_windows_uv_runtime
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime probe failed" }
          uv run --locked pytest tests/infra/test_cli_database_preparation.py tests/integration/test_build_matrix_school_expansion.py tests/integration/test_groupcode_runtime_authority.py::test_operator_workflow_db_build_allocate_qa_sabt tests/integration/test_groupcode_runtime_authority.py::test_mainwindow_real_gui_build_allocate_sabt_and_recovery tests/integration/test_groupcode_runtime_authority.py::test_excel_student_import_mixed_national_codes_to_sabt_readback tests/test_excel_export_smoke.py -q
          if ($LASTEXITCODE -ne 0) { throw "Representative clean-source integration failed" }
          $env:MATRIX_CI_SMOKE_CLOSE_MS = "2000"
          $startupLog = Join-Path $env:RUNNER_TEMP "matrix-uv-startup.txt"
          uv run --locked python -m app.main *> $startupLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $startupLog
            throw "Real app.main entrypoint failed"
          }
          $startupText = Get-Content $startupLog -Raw -Encoding utf8
          if ($startupText.Contains("UnicodeEncodeError") -or
              $startupText.Contains("--- Logging error ---")) {
            throw "Console logging failed despite successful application exit"
          }
          Write-Output "Real app.main exited successfully with no console encoding exceptions."
