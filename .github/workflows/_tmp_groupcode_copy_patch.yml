name: temporary groupcode copy patch

on:
  push:
    branches:
      - fix/groupcode-runtime-authority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - name: Remove final per-build Crosswalk wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/ui/main_window.py")
          text = path.read_text(encoding="utf-8")
          old = '"ورود فایل‌های Inspactor، مدارس و Crosswalk برای ساخت eligibility matrix مطابق Policy.",'
          new = '"انتخاب Inspactor و استفاده از مراجع School/GroupCode پایگاه داده برای ساخت eligibility matrix مطابق Policy.",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one Build subtitle match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/_tmp_groupcode_copy_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/main_window.py .github/workflows/_tmp_groupcode_copy_patch.yml
          git commit -m "docs(ui): clarify DB-backed Build references"
          git push origin HEAD:fix/groupcode-runtime-authority
