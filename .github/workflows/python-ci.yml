name: Python CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MATRIX2_TEMP_SKIP_QT_UI: "1" # TEMPORARY CI WAIVER: skip Qt UI tests on Windows until loader harness stabilized

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Type-check with mypy
        run: mypy

      - name: Run pytest
        run: python -m pytest -vv --disable-warnings --durations=20 -s
