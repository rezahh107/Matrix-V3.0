name: temporary fix stale build Crosswalk CLI tests

on:
  push:
    branches: ["fix/groupcode-runtime-authority"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX2_TEMP_SKIP_QT_UI: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - name: Remove deprecated Crosswalk input from unrelated fake-runner tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("tests/unit/test_cli_headless.py")
          text = path.read_text(encoding="utf-8")
          block8 = '            "--crosswalk",\n            "cross.xlsx",\n'
          block12 = '                "--crosswalk",\n                "cross.xlsx",\n'
          count = text.count(block8) + text.count(block12)
          if count != 6:
              raise SystemExit(f"expected exactly 6 deprecated CLI Crosswalk fixtures, found {count}")
          text = text.replace(block8, "").replace(block12, "")
          if '"--crosswalk"' in text:
              raise SystemExit("unexpected --crosswalk remains in test_cli_headless.py")
          path.write_text(text, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate affected CLI tests
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked pytest tests/unit/test_cli_headless.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check tests/unit/test_cli_headless.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit stale-test repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp_groupcode_fix_cli_headless.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_cli_headless.py .github/workflows/_tmp_groupcode_fix_cli_headless.yml
          git diff --cached --quiet && { echo 'expected staged CLI test repair'; exit 1; }
          git commit -m "test: remove deprecated Build Crosswalk fixtures"
          git push origin HEAD:fix/groupcode-runtime-authority
