name: temporary GroupCode full validation

on:
  push:
    branches: ["fix/groupcode-runtime-authority"]

permissions:
  contents: write

jobs:
  pre-merge-guards:
    name: Pre-merge guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Set up Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run pre-merge guards
        run: uv run --locked python tools/ci/pre_merge_guards.py

  core-windows:
    name: Core tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX2_TEMP_SKIP_QT_UI: "1"
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Set up Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint with ruff
        run: uv run --locked ruff check .
      - name: Run core pytest suite
        run: uv run --locked pytest tests/unit tests/infra tests/integration --maxfail=1 -q

  ui-windows:
    name: UI tests (Windows, Qt/PySide6)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [core-windows]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Set up Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run UI pytest suite
        run: uv run --locked pytest tests/ui --maxfail=1 -q

  cleanup:
    name: Remove temporary validation workflow
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-merge-guards, core-windows, ui-windows]
    steps:
      - name: Checkout remediation branch tip
        uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_tmp_groupcode_full_validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_tmp_groupcode_full_validation.yml
          git commit -m "chore: remove temporary GroupCode full validation workflow"
          git push origin HEAD:fix/groupcode-runtime-authority
