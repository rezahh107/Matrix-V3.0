name: temporary validate empty GroupCode import semantics

on:
  push:
    branches: ["fix/groupcode-runtime-authority"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MATRIX2_TEMP_SKIP_QT_UI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked pytest tests/infra/test_reference_readiness.py -q
      - run: uv run --locked ruff check tests/infra/test_reference_readiness.py
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp_groupcode_reference_readiness_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_tmp_groupcode_reference_readiness_fix.yml
          git commit -m "chore: remove temporary GroupCode readiness validation workflow"
          git push origin HEAD:fix/groupcode-runtime-authority
