name: Matrix dialog and operational evidence (isolated)

on:
  push:
    branches:
      - verify/matrix-dialog-operational-evidence-20261031

permissions:
  contents: write

jobs:
  capture-and-publish:
    name: Capture actual PySide6 widgets on offscreen Windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      MATRIX2_TEMP_SKIP_QT_UI: "0"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify head and unchanged production base
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --name-only 782d178f5dc539bc078e04a1e67a10ad6ea5baa4 HEAD > changed-files.txt
          cat changed-files.txt
          if grep -E '^(app/|config/|resources/|tests/|docs/LAW|docs/Technical)' changed-files.txt; then
            echo "Production/domain files changed in evidence-only branch" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Set up Python
        run: uv python install

      - name: Sync exact locked environment
        run: uv sync --locked

      - name: Capture live UI scenarios and preserve partial failures
        shell: bash
        run: |
          set +e
          uv run --locked python tools/capture_matrix_dialog_operational_evidence.py --output-dir evidence/ui/dialog-operational-20261031
          result=$?
          mkdir -p evidence/ui/dialog-operational-20261031
          printf "capture_exit_code=%s\nsource_branch_commit=%s\n" "$result" "$(git rev-parse HEAD)" > evidence/ui/dialog-operational-20261031/runner-status.txt
          exit 0

      - name: Publish PNGs, manifest and failures on evidence branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ui/dialog-operational-20261031
          if ! git diff --cached --quiet; then
            git commit -m "evidence(ui): publish actual offscreen dialog and run-state captures"
            git push origin HEAD:verify/matrix-dialog-operational-evidence-20261031
          fi

      - name: Upload fallback artifacts (not a substitute for branch evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-dialog-operational-evidence
          path: evidence/ui/dialog-operational-20261031
          if-no-files-found: warn

      - name: Mark incomplete evidence run as failed
        shell: bash
        run: |
          code="$(sed -n 's/^capture_exit_code=//p' evidence/ui/dialog-operational-20261031/runner-status.txt)"
          test "$code" = "0"
