name: Prompt 7 freeze packaging evidence

on:
  push:
    branches:
      - modernize/packaging-freeze-evidence

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-uv packaging tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller
      - name: Run documented pre-uv PyInstaller command
        run: pyinstaller tools/packaging/matrix2_gui.spec
