name: Prompt 7 corrected dependency evidence

on:
  push:
    branches:
      - modernize/uv-no-pytestqt-evidence

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Generate and check fresh lock
        run: |
          uv lock
          uv lock --check
          uv tree --all-groups --depth 1
      - name: Fresh sync and UI equivalence
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .venv, smart_student_allocation.egg-info -ErrorAction SilentlyContinue
          uv sync --locked
          uv run --locked pytest tests/ui --maxfail=1 -q
      - name: Upload corrected lock
        uses: actions/upload-artifact@v4
        with:
          name: corrected-uv-lock
          path: uv.lock
          if-no-files-found: error
