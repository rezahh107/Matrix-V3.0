name: CI — Advanced Guards (Flaky/Perf/DB)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  flaky-ui-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run flaky UI smoke
        run: python -m tools.ci.run_flaky_ui_smoke

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run performance smoke
        run: python -m tools.ci.run_perf_smoke

  db-snapshot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run DB snapshot smoke
        run: pytest tests/infra/test_local_database_snapshots.py -q
