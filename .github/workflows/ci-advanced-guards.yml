name: CI — Advanced Guards (Flaky/Perf/DB)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  flaky-ui-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Set up Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run flaky UI smoke
        run: uv run --locked python -m tools.ci.run_flaky_ui_smoke

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Set up Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run performance smoke
        run: uv run --locked python -m tools.ci.run_perf_smoke

  db-snapshot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\n' "$EXPECTED_SHA"
          printf 'Actual SHA:   %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Set up Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run DB snapshot smoke
        run: uv run --locked pytest tests/infra/test_local_database_snapshots.py -q
