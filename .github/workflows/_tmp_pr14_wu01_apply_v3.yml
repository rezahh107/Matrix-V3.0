name: temporary PR14 WU01 apply v3
on:
  push:
    branches: [fix/groupcode-runtime-authority]
permissions:
  contents: write
jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - name: Verify implementation base tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0644510f3be06718d1843a8f97b120b57e6d5d84"
          test "$(git rev-parse HEAD^^{tree})" = "40ab5d8b2ad65f7a304c65eab3730cadf49ab2ea"
      - name: Apply bounded G1/G2 repair
        shell: bash
        run: |
          set -euo pipefail
          git show 77dde7d5b42f7d2d7721d2b4cc75b4533022046c:.github/workflows/_tmp_pr14_wu01_apply_v2.yml > /tmp/apply-v2.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/apply-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          if 'count=6)' not in script:
              raise SystemExit('expected v2 unit-count guard not found')
          script = script.replace('count=6)', 'count=5)', 1)
          exec(compile(script, '<bounded-v2-patch>', 'exec'))

          p = Path('tests/unit/test_cli_headless.py')
          text = p.read_text(encoding='utf-8')
          old = '                "--schools",\n                "schools.xlsx",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one nested --schools consumer, found {text.count(old)}')
          p.write_text(text.replace(old, ''), encoding='utf-8')
          PY
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - run: uv python install
      - run: uv sync --locked
      - name: T-001 stale preflight consumer
        run: uv run --locked pytest tests/integration/test_alignment_allocation_parity.py::test_allocation_preflight_matrix_pool_source -q
      - name: T-002 reference authority regressions
        run: uv run --locked pytest tests/integration/test_groupcode_runtime_authority.py -q
      - name: T-003 db-none negative control
        run: uv run --locked pytest tests/integration/test_alignment_allocation_parity.py::test_student_resolution_rejects_missing_authoritative_db -q
      - name: T-004 DB-only Build positive control
        run: uv run --locked pytest tests/integration/test_groupcode_runtime_authority.py::test_p0_01_explicit_groupcode_import_reaches_real_build -q
      - name: T-005 School runtime-file rejection
        run: uv run --locked pytest tests/integration/test_groupcode_runtime_authority.py::test_deprecated_build_schools_fails_without_mutating_db -q
      - name: Same-root CLI unit consumers
        run: uv run --locked pytest tests/unit/test_cli_headless.py -q
      - name: T-007 Ruff
        run: uv run --locked ruff check .
      - name: Mechanical closure search
        shell: bash
        run: |
          set -euo pipefail
          echo '=== remaining --schools ==='
          git grep -n -- "--schools" app tests docs/SmartAlloc_GUI_Operator_Guide.fa.md || true
          echo '=== student resolver callers ==='
          git grep -n "_resolve_students_frame" -- app tests || true
          test "$(git grep -n -- "--schools" tests/unit/test_cli_headless.py | wc -l)" -eq 0
          test "$(git grep -n "_resolve_students_frame(args, policy, db=None)" tests/integration/test_alignment_allocation_parity.py | wc -l)" -eq 1
      - name: Commit validated repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp_pr14_wu01_apply_v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/infra/cli_legacy.py app/ui/main_window.py tests/integration/test_alignment_allocation_parity.py tests/integration/test_groupcode_runtime_authority.py tests/unit/test_cli_headless.py tests/ui/test_groupcode_runtime_authority_ui.py .github/workflows/_tmp_pr14_wu01_apply_v3.yml
          git commit -m "fix: enforce DB-only School build authority"
          git push origin HEAD:fix/groupcode-runtime-authority
  cleanup-on-failure:
    if: failure()
    needs: apply-validate-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groupcode-runtime-authority
          fetch-depth: 0
      - name: Remove temporary workflow after failure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/_tmp_pr14_wu01_apply_v3.yml ]; then exit 0; fi
          rm .github/workflows/_tmp_pr14_wu01_apply_v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_tmp_pr14_wu01_apply_v3.yml
          git commit -m "chore: remove temporary PR14 apply v3 workflow"
          git push origin HEAD:fix/groupcode-runtime-authority
